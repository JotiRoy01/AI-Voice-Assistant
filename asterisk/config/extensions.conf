; ============================================================================
; FlowMind AI — Bangla Order Confirmation IVR Dialplan (SRS Section 3.2 & 11)
; Triggered by Node.js AsteriskAriAdapter with channel variables:
;   FLOWMIND_CALL_ID, FLOWMIND_AUDIO_URL, FLOWMIND_CALLBACK_URL,
;   FLOWMIND_REPLAY_LIMIT, FLOWMIND_INVALID_LIMIT
; ============================================================================

[general]
static=yes
writeprotect=yes

[flowmind-ivr]
exten => s,1,NoOp(FlowMind AI Order Confirmation IVR — Call ${FLOWMIND_CALL_ID})
 same => n,Answer()
 same => n,Set(REPLAYS=0)
 same => n,Set(INVALIDS=0)
 same => n,Set(MAX_REPLAYS=${IF($["${FLOWMIND_REPLAY_LIMIT}" != ""]?${FLOWMIND_REPLAY_LIMIT}:1)})
 same => n,Set(MAX_INVALIDS=${IF($["${FLOWMIND_INVALID_LIMIT}" != ""]?${FLOWMIND_INVALID_LIMIT}:2)})
 same => n,System(/usr/local/bin/flowmind-callback.sh "${CHANNEL(uniqueid)}" "answered" "" "${CDR(billsec)}")

; Play order-specific Bangla summary & keypad menu (DTMF 1/2/3)
 same => n(play_menu),Read(DIGIT,${FLOWMIND_AUDIO_URL},1,,1,8)
 same => n,GotoIf($["${DIGIT}" = "1"]?dtmf_1)
 same => n,GotoIf($["${DIGIT}" = "2"]?dtmf_2)
 same => n,GotoIf($["${DIGIT}" = "3"]?dtmf_3)
 same => n,GotoIf($["${DIGIT}" = ""]?no_input:invalid_key)

 same => n(dtmf_1),NoOp(Customer pressed 1 — Confirm Order)
 same => n,System(/usr/local/bin/flowmind-callback.sh "${CHANNEL(uniqueid)}" "dtmf" "1" "${CDR(billsec)}")
 same => n,Playback(flowmind/key1_confirmed)
 same => n,Hangup()

 same => n(dtmf_2),NoOp(Customer pressed 2 — Cancellation Request)
 same => n,System(/usr/local/bin/flowmind-callback.sh "${CHANNEL(uniqueid)}" "dtmf" "2" "${CDR(billsec)}")
 same => n,Playback(flowmind/key2_cancel)
 same => n,Hangup()

 same => n(dtmf_3),NoOp(Customer pressed 3 — WhatsApp Custom Requirement)
 same => n,System(/usr/local/bin/flowmind-callback.sh "${CHANNEL(uniqueid)}" "dtmf" "3" "${CDR(billsec)}")
 same => n,Playback(flowmind/key3_whatsapp)
 same => n,Hangup()

 same => n(no_input),Set(REPLAYS=$[${REPLAYS} + 1])
 same => n,System(/usr/local/bin/flowmind-callback.sh "${CHANNEL(uniqueid)}" "dtmf" "no_input" "${CDR(billsec)}")
 same => n,GotoIf($[${REPLAYS} <= ${MAX_REPLAYS}]?play_menu)
 same => n,Hangup()

 same => n(invalid_key),Set(INVALIDS=$[${INVALIDS} + 1])
 same => n,System(/usr/local/bin/flowmind-callback.sh "${CHANNEL(uniqueid)}" "dtmf" "${DIGIT}" "${CDR(billsec)}")
 same => n,GotoIf($[${INVALIDS} < ${MAX_INVALIDS}]?play_menu)
 same => n,Hangup()

exten => h,1,NoOp(Call ended — status ${DIALSTATUS}, duration ${CDR(billsec)}s)
 same => n,GotoIf($["${DIALSTATUS}" = "NOANSWER"]?report_no_answer)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?report_busy)
 same => n,Return()
 same => n(report_no_answer),System(/usr/local/bin/flowmind-callback.sh "${CHANNEL(uniqueid)}" "no_answer" "" "0")
 same => n,Return()
 same => n(report_busy),System(/usr/local/bin/flowmind-callback.sh "${CHANNEL(uniqueid)}" "busy" "" "0")
 same => n,Return()
