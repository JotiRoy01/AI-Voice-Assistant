; ============================================================================
; FlowMind AI — Asterisk PJSIP Trunk Configuration (SRS Section 6 & 7)
; Replace SIP_TRUNK_HOST, SIP_USERNAME, SIP_PASSWORD with your authorized
; Bangladesh IPTSP / SIP Trunk / GSM Gateway credentials before production.
; ============================================================================

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[bd-sip-trunk]
type=registration
transport=transport-udp
outbound_auth=bd-sip-trunk-auth
server_uri=sip:SIP_TRUNK_HOST
client_uri=sip:SIP_USERNAME@SIP_TRUNK_HOST
retry_interval=60

[bd-sip-trunk-auth]
type=auth
auth_type=userpass
username=SIP_USERNAME
password=SIP_PASSWORD

[bd-sip-trunk-aor]
type=aor
contact=sip:SIP_TRUNK_HOST

[bd-sip-trunk]
type=endpoint
transport=transport-udp
context=from-sip-trunk
disallow=all
allow=alaw,ulaw,g722
outbound_auth=bd-sip-trunk-auth
aors=bd-sip-trunk-aor
dtmf_mode=rfc4733
direct_media=no
from_domain=SIP_TRUNK_HOST

[bd-sip-trunk-identify]
type=identify
endpoint=bd-sip-trunk
match=SIP_TRUNK_HOST
